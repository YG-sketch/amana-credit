<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Payment Confirmation - Amana Credit</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        header {
            background: white;
            padding: 20px 7%;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.06);
        }

        .country {
            display: inline-block;
            background: #ecfdf3;
            color: #047857;
            padding: 8px 13px;
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #667085;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .summary {
            background: #f9fafb;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 25px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
        }

        .label {
            color: #667085;
        }

        .value {
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 13px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            font-size: 15px;
            background: white;
        }

        input:focus {
            outline: none;
            border-color: #0f766e;
        }

        .upload-box {
            border: 2px dashed #d0d5dd;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
        }

        .upload-box p {
            color: #667085;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .preview {
            display: none;
            margin-top: 15px;
        }

        .preview img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
        }

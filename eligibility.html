<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eligibility Assessment - Loan Platform</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        header {
            background: white;
            padding: 20px 7%;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.06);
        }

        .country {
            display: inline-block;
            background: #ecfdf3;
            color: #047857;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .intro {
            color: #667085;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .question {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 9px;
        }

        select,
        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            font-size: 15px;
            background: white;
        }

        select:focus,
        input:focus {
            outline: none;
            border-color: #0f766e;
        }

        .continue-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 9px;
            background: #0f766e;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .continue-btn:hover {
            background: #115e59;
        }

        .progress {
            margin-bottom: 30px;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #667085;
            margin-bottom: 8px;
        }

        .progress-bar {
            height: 7px;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 60%;
            background: #0f766e;
        }

        .applicant {
            background: #f9fafb;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .applicant p {
            margin: 5px 0;
            color: #475467;
        }

        @media (max-width: 600px) {
            .container {
                margin: 15px auto;
            }

            .card {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">Loan Platform</div>
</header>

<div class="container">

    <div class="card">

        <div class="progress">

            <div class="progress-text">
                <span>Application progress</span>
                <span>2 of 3</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>

        </div>

        <div id="countryBadge" class="country">
            Country
        </div>

        <h1>Eligibility Assessment</h1>

        <p class="intro">
            Please answer the following questions accurately. Your answers
            will be used as part of our initial assessment.
        </p>

        <div class="applicant">

            <p>
                <strong>Applicant:</strong>
                <span id="applicantName">---</span>
            </p>

            <p>
                <strong>Phone:</strong>
                <span id="applicantPhone">---</span>
            </p>

        </div>

        <form id="eligibilityForm">

            <div class="question">

                <label for="employment">
                    How long have you had your current source of income?
                </label>

                <select id="employment" required>

                    <option value="">
                        Select an option
                    </option>

                    <option value="less3">
                        Less than 3 months
                    </option>

                    <option value="3to6">
                        3 - 6 months
                    </option>

                    <option value="6to12">
                        6 - 12 months
                    </option>

                    <option value="over12">
                        More than 12 months
                    </option>

                </select>

            </div>

            <div class="question">

                <label for="monthlyIncome">
                    What is your approximate monthly income?
                </label>

                <select id="monthlyIncome" required>

                    <option value="">
                        Select an option
                    </option>

                    <option value="low">
                        Below 10,000
                    </option>

                    <option value="medium">
                        10,000 - 30,000
                    </option>

                    <option value="high">
                        30,001 - 60,000
                    </option>

                    <option value="veryhigh">
                        Above 60,000
                    </option>

                </select>

            </div>

            <div class="question">

                <label for="existingLoan">
                    Do you currently have another loan?
                </label>

                <select id="existingLoan" required>

                    <option value="">
                        Select an option
                    </option>

                    <option value="no">
                        No
                    </option>

                    <option value="yes">
                        Yes
                    </option>

                </select>

            </div>

            <div class="question">

                <label for="repayment">
                    How soon could you repay a short-term loan?
                </label>

                <select id="repayment" required>

                    <option value="">
                        Select an option
                    </option>

                    <option value="7">
                        Within 7 days
                    </option>

                    <option value="14">
                        Within 14 days
                    </option>

                    <option value="30">
                        Within 30 days
                    </option>

                </select>

            </div>

            <button
                type="submit"
                class="continue-btn"
            >
                Complete Assessment
            </button>

        </form>

    </div>

</div>

<script>

const country = localStorage.getItem("country");
const fullname = localStorage.getItem("fullname");
const phone = localStorage.getItem("phone");

const countryNames = {
    KE: "🇰🇪 Kenya (KE)",
    UG: "🇺🇬 Uganda (UG)",
    TZ: "🇹🇿 Tanzania (TZ)"
};

document.getElementById("countryBadge").textContent =
    countryNames[country] || "Country not detected";

document.getElementById("applicantName").textContent =
    fullname || "Applicant";

document.getElementById("applicantPhone").textContent =
    phone || "---";


document
    .getElementById("eligibilityForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();

        const assessment = {

            employment:
                document.getElementById("employment").value,

            monthlyIncome:
                document.getElementById("monthlyIncome").value,

            existingLoan:
                document.getElementById("existingLoan").value,

            repayment:
                document.getElementById("repayment").value

        };

        localStorage.setItem(
            "assessment",
            JSON.stringify(assessment)
        );

        window.location.href = "loan-offer.html";

    });

</script>

</body>
</html>
